<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurobot 2027 Score Calculator - Camelot</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333;
            --blue-team: #005b8c; /* RAL 5017 */
            --yellow-team: #f7b500; /* RAL 1023 */
            --accent: #2e8b57;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .calculator {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--blue-team);
            margin-bottom: 5px;
        }

        h2 {
            border-bottom: 2px solid var(--yellow-team);
            padding-bottom: 5px;
            margin-top: 30px;
            font-size: 1.2rem;
            color: var(--blue-team);
        }

        .action-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        /* Fixed Label Stretching CSS */
        .action-group label:not(.switch) {
            flex: 1;
            padding-right: 15px;
            font-weight: 500;
        }

        /* Number Control Styling */
        .number-control {
            display: flex;
            align-items: center;
        }

        .btn-step {
            background-color: var(--blue-team);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .btn-step:hover {
            background-color: #00446b;
        }

        .btn-step:active {
            background-color: var(--accent);
        }

        .action-group input[type="number"] {
            width: 50px;
            padding: 6px;
            margin: 0 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            -moz-appearance: textfield; /* Hides default arrows in Firefox */
        }

        /* Hides default arrows in Chrome/Safari */
        .action-group input[type="number"]::-webkit-outer-spin-button,
        .action-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Toggle Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
            flex: 0 0 50px; /* Prevents switch from stretching */
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .score-display {
            position: sticky;
            bottom: 20px;
            background-color: var(--blue-team);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .action-group select {
            flex: 0 0 auto;
            max-width: 50%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .warning {
            color: #b00020;
            font-size: 0.85rem;
            min-height: 1em;
        }

        .cite {
            font-size: 0.75rem;
            color: #777;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h1>Camelot</h1>
        <p style="text-align: center; color: #666;">Eurobot 2027 Score Calculator</p>

        <h2>E.1 Construction of the Glorious Camelot!</h2>
        <div class="action-group">
            <label>
                Stones placed in a construction zone (1 pt each)
                <span class="cite">30 stones on the table.</span>
            </label>
            <div class="number-control">
                <button class="btn-step" onclick="stepInput('stones_placed', -1)">-</button>
                <input type="number" id="stones_placed" min="0" max="30" value="0">
                <button class="btn-step" onclick="stepInput('stones_placed', 1)">+</button>
            </div>
        </div>
        <div class="action-group">
            <label>
                Walls built (5 pts each)
                <span class="cite">3 horizontal stones stacked in a wall area.</span>
            </label>
            <div class="number-control">
                <button class="btn-step" onclick="stepInput('walls_built', -1)">-</button>
                <input type="number" id="walls_built" min="0" max="5" value="0">
                <button class="btn-step" onclick="stepInput('walls_built', 1)">+</button>
            </div>
        </div>
        <div class="action-group">
            <label>
                Towers built (5 pts each)
                <span class="cite">1 vertical stone in a circular area.</span>
            </label>
            <div class="number-control">
                <button class="btn-step" onclick="stepInput('towers_built', -1)">-</button>
                <input type="number" id="towers_built" min="0" max="4" value="0">
                <button class="btn-step" onclick="stepInput('towers_built', 1)">+</button>
            </div>
        </div>
        <div class="action-group">
            <label>
                Gate built (20 pts)
                <span class="cite">2 vertical stones topped by 1 horizontal stone. Max 1 per castle.</span>
            </label>
            <label class="switch">
                <input type="checkbox" id="gate_built">
                <span class="slider"></span>
            </label>
        </div>
        <div class="warning" id="stones_warning"></div>

        <h2>E.2 I Have the Real One!</h2>
        <div class="action-group">
            <label>
                Grail position (5 pts in castle + 5 pts per level)
                <span class="cite">Level of the lowest point of the Grail at the end of the match.</span>
            </label>
            <select id="grail_level">
                <option value="-1">Not in castle</option>
                <option value="0">In castle, floor</option>
                <option value="1">Level 1 (1 horizontal stone)</option>
                <option value="2">Level 2 (2 horizontal stones)</option>
                <option value="3">Level 3 (3 horizontal / 1 vertical)</option>
                <option value="4">Level 4 (robot roof)</option>
            </select>
        </div>

        <h2>E.3 The Return of the King</h2>
        <div class="action-group">
            <label>
                Main robot in its throne room
                <span class="cite">Partially: 5 pts. Completely: 10 pts.</span>
            </label>
            <select id="robot_area">
                <option value="0">No</option>
                <option value="5">Partially</option>
                <option value="10">Completely</option>
            </select>
        </div>

        <h2>E.4 To the Attack!</h2>
        <div class="action-group">
            <label>
                Opposing moats occupied by a SIMA (5 pts each)
            </label>
            <div class="number-control">
                <button class="btn-step" onclick="stepInput('moats_occupied', -1)">-</button>
                <input type="number" id="moats_occupied" min="0" max="3" value="0">
                <button class="btn-step" onclick="stepInput('moats_occupied', 1)">+</button>
            </div>
        </div>
        <div class="action-group">
            <label>
                At least one SIMA attacks an opposing SIMA (5 pts)
            </label>
            <label class="switch">
                <input type="checkbox" id="sima_attack">
                <span class="slider"></span>
            </label>
        </div>
        <div class="action-group">
            <label>
                Cannonballs in the opposing castle (5 pts each)
                <span class="cite">+15 pts if 3 or more. 10 cannonballs per team.</span>
            </label>
            <div class="number-control">
                <button class="btn-step" onclick="stepInput('cannonballs', -1)">-</button>
                <input type="number" id="cannonballs" min="0" max="10" value="0">
                <button class="btn-step" onclick="stepInput('cannonballs', 1)">+</button>
            </div>
        </div>

        <div class="score-display">
            Total Score: <span id="total_score">0</span>
        </div>
    </div>

    <script>
        // Button Logic: Increases or decreases value while respecting min/max
        function stepInput(id, step) {
            const input = document.getElementById(id);
            let currentValue = parseInt(input.value) || 0;
            
            // Get min/max boundaries if they exist
            let min = input.hasAttribute('min') ? parseInt(input.min) : -Infinity;
            let max = input.hasAttribute('max') ? parseInt(input.max) : Infinity;

            let newValue = currentValue + step;

            // Apply value if within limits
            if (newValue >= min && newValue <= max) {
                input.value = newValue;
                calculateScore(); // Re-calculate when button is clicked
            }
        }

        function getInt(id) {
            return parseInt(document.getElementById(id).value) || 0;
        }

        // Calculation Logic
        const inputs = document.querySelectorAll('input, select');
        const scoreDisplay = document.getElementById('total_score');
        const stonesWarning = document.getElementById('stones_warning');

        function calculateScore() {
            let score = 0;

            // E.1
            const stones = getInt('stones_placed');
            const walls = getInt('walls_built');
            const towers = getInt('towers_built');
            const gate = document.getElementById('gate_built').checked;
            score += stones * 1;
            score += walls * 5;
            score += towers * 5;
            if (gate) score += 20;

            // A stone cannot count for multiple constructions at the same time
            const stonesNeeded = walls * 3 + towers + (gate ? 3 : 0);
            stonesWarning.textContent = stones < stonesNeeded
                ? `Check: these constructions use at least ${stonesNeeded} stones.`
                : '';

            // E.2
            const grailLevel = parseInt(document.getElementById('grail_level').value);
            if (grailLevel >= 0) score += 5 + grailLevel * 5;

            // E.3
            score += parseInt(document.getElementById('robot_area').value);

            // E.4
            score += getInt('moats_occupied') * 5;
            if (document.getElementById('sima_attack').checked) score += 5;
            const cannonballs = getInt('cannonballs');
            score += cannonballs * 5;
            if (cannonballs >= 3) score += 15;

            scoreDisplay.textContent = score;
        }

        // Attach event listeners to all inputs to update score dynamically
        inputs.forEach(input => {
            input.addEventListener('input', calculateScore);
            input.addEventListener('change', calculateScore);
        });

        // Initial Calculation
        calculateScore();
    </script>
</body>
</html>
